<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP3 Ej.13</title>
    <link rel="stylesheet" href="TP3_styles_13.css">
</head>

<body>
    <div class="formulario">
        <h1>Contáctanos</h1>
        <form>
            <div>
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Ej. Santiago" required>
            </div>
            <br>

            <div>
            <label for="lastname">Apellido:</label>
            <input type="text" id="lastname" name="lastname" placeholder="Ej. Gomez" required>
            </div>

            <br>

            <div>
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="mail" placeholder="Ej. correoelectronico@gmail.com" required>
            </div>

            <br>

            <div>
            <label for="message">Escribenos un Mensaje:</label><br/>
            <textarea text="" rows=4" cols="35"></textarea>
            </div>

            <br>
            <input type="submit" value="Enviar"/> <input type="reset" value="Borrar"/>
        </form>
    </div>
</body>

</html>
