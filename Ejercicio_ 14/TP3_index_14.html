<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 3 Ej. 14</title>
    <link rel="stylesheet" href="TP3_styles_14.css">
</head>
<body>

    <header>
        <h1>Mi página</h1>
        <p>Variables CSS y temas</p>
    </header>

    <main>
        <section class="contenido">
            <h2>Prueba de Cambio de Tema</h2>
            <p>
                Esta página utiliza variables CSS para controlar los colores,
                espacios y estilos, aunque muy ligeramente.
            </p>

            <div class="tarjetas">
                <article class="tarjeta">
                    <img src="1.gif" alt="Gif de Stocking">
                </article>
            </div>

            <button onclick="document.body.classList.toggle('oscuro')">
                Cambiar tema
            </button>
        </section>
    </main>

</body>
</html>
